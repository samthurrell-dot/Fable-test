<style>
  :root { --ink: rgba(255, 250, 240, 0.94); --soft: rgba(255, 250, 240, 0.7); --line: rgba(255, 250, 240, 0.34); --pad: rgba(30, 21, 15, 0.42); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1d14; }
  body { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #scene, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { touch-action: none; cursor: move; opacity: 0; transition: opacity 1.2s ease; }
  .ready #scene { opacity: 1; }
  #overlay { pointer-events: none; }
  header, .dock, #sound, #caption, #legend { transition: opacity 0.8s ease; }
  .idle header { opacity: 0; }
  .idle .dock, .idle #sound { opacity: 0.4; }
  @media (prefers-reduced-motion: reduce) { #scene, header, .dock, #sound, #caption { transition: none; } }
  .shade { text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5), 0 0 2px rgba(0, 0, 0, 0.4); }
  header { position: fixed; left: max(20px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); pointer-events: none; max-width: min(72vw, 460px); }
  h1 { margin: 0; font-weight: 600; font-size: 22px; letter-spacing: 0.005em; }
  header p { margin: 4px 0 0; font-size: 15px; font-style: italic; color: var(--soft); line-height: 1.3; }
  button { font: inherit; font-size: 15px; white-space: nowrap; color: var(--ink); background: var(--pad); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; min-height: 44px; min-width: 44px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  button:hover, button:focus-visible { background: rgba(30, 21, 15, 0.62); outline: none; border-color: rgba(255, 250, 240, 0.75); }
  button:disabled { opacity: 0.35; cursor: default; }
  #sound { position: fixed; right: max(20px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); }
  .dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; }
  .dock .arrow { width: 48px; padding: 0; font-size: 22px; line-height: 1; }
  #count { min-width: 5.2em; text-align: center; font-size: 17px; }
  #caption { display: none; position: fixed; left: 18px; right: 18px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); text-align: center; font-size: 17px; line-height: 1.35; }
  #legend { position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); font: 13px/1.5 ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
    background: rgba(250, 248, 240, 0.94); color: #16212b; padding: 10px 14px; border-radius: 10px; max-width: 280px; }
  #legend b { display: block; margin-bottom: 4px; }
  #legend i { display: inline-block; width: 34px; height: 0; margin-right: 8px; vertical-align: middle; border-top: 3px dashed; }
  #legend .v { border-color: #1668c7; } #legend .m { border-color: #d2372b; border-top-style: double; border-top-width: 4px; } #legend .g { border-color: #0d8f86; border-top-style: dotted; }
  #legend .t { display: inline-block; width: 34px; height: 10px; margin-right: 8px; vertical-align: middle; background: rgba(20, 150, 170, 0.45); }
  #stats { position: fixed; left: 20px; top: 84px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--ink); }
  #loading { position: fixed; left: 0; right: 0; top: 44%; text-align: center; font-size: 20px; font-style: italic; pointer-events: none; }
  #error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 18px; background: #2a1d14; }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    h1 { font-size: 19px; } header { max-width: calc(100vw - 172px); } header p { font-size: 14px; }
    button { padding: 8px 13px; font-size: 14px; }
    #caption { display: block; }
    #legend { left: 12px; right: 12px; max-width: none; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px); }
    .engineer #caption { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="A pop-up book lying open on a wooden table"></canvas>
<canvas id="overlay" aria-hidden="true"></canvas>
<header class="shade">
  <h1>Where the river goes</h1>
  <p id="hint">Drag a page by its outer edge to turn it. Pull the tabs. Press E for the engineer's view.</p>
</header>
<button id="sound" type="button" aria-pressed="false">Enable sound</button>
<p id="caption" class="shade" aria-live="polite"></p>
<div id="legend" hidden>
  <b id="legend-count"></b>
  <div><i class="v"></i>valley fold</div>
  <div><i class="m"></i>mountain fold</div>
  <div><i class="g"></i>glue line</div>
  <div><span class="t"></span>glue tab</div>
</div>
<div class="dock shade">
  <button id="prev" class="arrow" type="button" aria-label="Turn back a page">&#8249;</button>
  <span id="count">Cover</span>
  <button id="next" class="arrow" type="button" aria-label="Turn to the next page">&#8250;</button>
  <button id="engineer" type="button" aria-pressed="false">Engineer's view</button>
</div>
<div id="loading" class="shade" role="status">Cutting the card…</div>
<div id="stats" class="shade" hidden></div>
<div id="error" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
