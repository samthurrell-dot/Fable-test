<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree grower demo</title>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f3f1ea; color: #222; display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100vh; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  aside { padding: 16px; overflow: auto; background: #fff; border-left: 1px solid #ddd; }
  h1 { font-size: 18px; margin: 0 0 4px; } p { margin: 0 0 12px; color: #555; }
  label { display: block; margin: 10px 0 2px; } input[type=range] { width: 100%; height: 32px; }
  output { float: right; color: #555; } pre { font-size: 12px; color: #555; white-space: pre-wrap; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; } aside { border-left: 0; border-top: 1px solid #ddd; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside>
  <h1>Tree grower</h1>
  <p>The engine in <code>engine/tree.js</code> on its own: the branch skeleton, drawn as lines. Drag the picture to turn it.</p>
  <div id="controls"></div>
  <pre id="stats"></pre>
</aside>
<script type="module">
import { growSkeleton, TREE_DEFAULTS } from '../engine/tree.js';

// name, min, max, step
const SLIDERS = [
  ['seed', 1, 60, 1], ['attractors', 400, 6000, 100], ['influenceRadius', 1, 5, 0.1], ['killRadius', 0.25, 1.5, 0.05],
  ['step', 0.15, 0.6, 0.01], ['upBias', -0.2, 0.5, 0.01], ['crownRadiusXZ', 2, 8, 0.1], ['crownRadiusY', 1.5, 7, 0.1],
  ['crownUnderside', 0.2, 1, 0.02], ['crownLumpiness', 0, 0.5, 0.01], ['trunkHeight', 0.5, 5, 0.1], ['pipeExponent', 1.6, 3, 0.05],
];
const opts = { ...TREE_DEFAULTS };
const box = document.getElementById('controls');
for (const [name, min, max, step] of SLIDERS) {
  const label = document.createElement('label');
  const out = document.createElement('output');
  out.textContent = opts[name];
  label.append(name, out);
  const input = Object.assign(document.createElement('input'), { type: 'range', min, max, step, value: opts[name] });
  input.addEventListener('input', () => { opts[name] = +input.value; out.textContent = input.value; grow(); });
  box.append(label, input);
}

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let skel, yaw = 0.6, drag = false, lx = 0;
canvas.addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (drag) { yaw += (e.clientX - lx) * 0.01; lx = e.clientX; } });
canvas.addEventListener('pointerup', () => { drag = false; });

function grow() {
  const t0 = performance.now();
  skel = growSkeleton(opts);
  document.getElementById('stats').textContent = `${skel.count} nodes · trunk radius ${skel.radius[0].toFixed(2)} m · grown in ${(performance.now() - t0).toFixed(0)} ms`;
}

function draw() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = canvas.clientWidth * dpr, h = canvas.clientHeight * dpr;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.fillStyle = '#f3f1ea'; ctx.fillRect(0, 0, w, h);
  if (!drag) yaw += 0.003;
  const s = Math.min(w / 14, h / 12), cx = w / 2, cy = h - 0.6 * s;
  const c = Math.cos(yaw), sn = Math.sin(yaw);
  ctx.strokeStyle = '#3b2c22'; ctx.lineCap = 'round';
  const { X, Y, Z, parent, radius, count } = skel;
  for (let i = 1; i < count; i++) {
    const p = parent[i];
    ctx.lineWidth = Math.max(1, radius[i] * 2 * s);
    ctx.beginPath();
    ctx.moveTo(cx + (X[p] * c + Z[p] * sn) * s, cy - Y[p] * s);
    ctx.lineTo(cx + (X[i] * c + Z[i] * sn) * s, cy - Y[i] * s);
    ctx.stroke();
  }
  requestAnimationFrame(draw);
}
grow(); draw();
</script>
</body>
</html>
